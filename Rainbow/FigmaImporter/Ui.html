<meta charset="utf-8" />
<style>
  :root{
    --bg:#fcfcfb;
    --text:#1d1d1f;
    --muted:#8a8f98;
    --soft:#60646c;
    --accent:#18a0fb;
    --line:#e5e7eb;
    --ok:#12b76a;
    --busy:#f79009;
    --err:#d92d20;
    --idle:#c8ccd2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1d2128;
      --text:#ecf1f6;
      --muted:#7f8899;
      --soft:#98a3b3;
      --accent:#5cb8ff;
      --line:#3a414c;
      --idle:#4a525f;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:12px/1.5 Inter,"SF Pro Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{
    min-height:100vh;
    padding:56px 24px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .logo{
    width:176px;
    aspect-ratio:16/9;
    object-fit:cover;
    object-position:center 47%;
    clip-path:inset(3px 0);
    display:block;
    margin:0 0 22px;
  }
  h1{font-size:22px;font-weight:600;letter-spacing:-0.01em;margin:0 0 8px}
  .bridge{display:none}
  .actions{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:64px;
  }
  button{
    font:inherit;
    cursor:pointer;
    min-height:40px;
    min-width:136px;
    border-radius:8px;
    padding:9px 18px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    transition:opacity .12s ease;
  }
  button.ghost{background:transparent;color:var(--accent)}
  button.link{border:0;background:none;color:var(--accent);padding:2px 4px}
  button:disabled{opacity:.5;cursor:default}
  button:hover:not(:disabled){opacity:.85}
  .status{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:var(--soft);
    line-height:1.45;
    word-break:break-word;
    max-width:320px;
  }
  .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--idle)}
  .dot.on{background:var(--ok)}
  .dot.busy{background:var(--busy)}
  .dot.err{background:var(--err)}
  .status.err{color:var(--err)}
  .stats{margin-top:6px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ver{margin-top:auto;color:var(--muted);font-size:11px}
  .hidden{display:none}
</style>

    <h1>Pixso2Figma</h1>
    <div class="status" id="receiver-status" role="status" aria-live="polite"><span class="dot"></span><span>Остановлен</span></div>
    <div class="stats hidden" id="receiver-stats"></div>
    <div class="bridge" id="bridge-label">http://localhost:8787</div>

    <div class="actions">
      <button id="receiver-start" type="button">Start receiver</button>
      <button id="receiver-stop" type="button" class="ghost hidden">Stop receiver</button>
      <button id="receiver-log" type="button" class="link">Скачать лог</button>
    </div>
  </div>

  <div class="ver">v0.8.4</div>
</div>

<script>
(function () {
  "use strict";

  // Транспорт bridge. Версия 2 добавила receiver lease: каждый запрос
  // приёмника обязан нести выданный ему receiverId.
  var PROTOCOL_VERSION = 2;
  // Адрес фиксирован: manifest.json разрешает плагину ровно этот домен,
  // поэтому выбирать в UI было нечего.
  var BRIDGE_URL = "http://localhost:8787";
  // Оба режима сборки включены всегда — раньше это были чекбоксы с теми же
  // значениями по умолчанию.
  var IMPORT_OPTIONS = { promoteComponents: true, createPages: true };

  function id(name) { return document.getElementById(name); }
  function send(m) { parent.postMessage({ pluginMessage: m }, "*"); }

  // =====================================================================
  // Диагностика. Плагин не пишет на диск, поэтому события уходят в bridge,
  // а копия хранится в памяти — чтобы лог можно было забрать и без bridge.
  // Сеть трогается только когда активен receiver.
  // =====================================================================
  function createDiagnostics(options) {
    var RING_LIMIT = 800;
    var FLUSH_MS = 1500;
    var ring = [];
    var queue = [];
    var timer = null;

    function record(level, event, fields) {
      var entry = {
        ts: new Date().toISOString(),
        source: options.source,
        level: level,
        event: String(event),
      };
      if (fields) {
        if (fields.message !== undefined) entry.message = String(fields.message);
        if (fields.data !== undefined) entry.data = fields.data;
        if (fields.jobId) entry.jobId = fields.jobId;
        if (fields.taskId) entry.taskId = fields.taskId;
      }
      ring.push(entry);
      if (ring.length > RING_LIMIT) ring.splice(0, ring.length - RING_LIMIT);
      queue.push(entry);
      if (level === "error") flush();
      else schedule();
      return entry;
    }

    function schedule() {
      if (timer) return;
      timer = setTimeout(function () { timer = null; flush(); }, FLUSH_MS);
    }

    function flush() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!queue.length) return;
      var base = options.getBase();
      // Без адреса bridge или вне активной сессии копим только в памяти.
      if (!base || !options.isActive()) return;
      var batch = queue.splice(0, queue.length);
      try {
        fetch(base + "/log", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ entries: batch }),
        }).catch(function () { /* лог не должен мешать миграции */ });
      } catch (_e) { /* fetch недоступен */ }
    }

    // Необработанные ошибки UI: раньше они пропадали бесследно.
    try {
      window.addEventListener("error", function (event) {
        record("error", "ui.uncaught", {
          message: (event && event.message) || "unknown",
          data: { file: event && event.filename, line: event && event.lineno },
        });
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        record("error", "ui.unhandledRejection", {
          message: (reason && reason.message) || String(reason),
        });
      });
    } catch (_eHooks) { /* окружение без addEventListener */ }

    return {
      info: function (event, fields) { return record("info", event, fields); },
      warn: function (event, fields) { return record("warn", event, fields); },
      error: function (event, fields) { return record("error", event, fields); },
      flush: flush,
      entries: function () { return ring.slice(); },
      text: function () {
        return ring.map(function (e) {
          var parts = [e.ts, e.source, e.level, e.event];
          if (e.taskId) parts.push(e.taskId);
          if (e.message) parts.push(e.message);
          if (e.data !== undefined) parts.push(JSON.stringify(e.data));
          return parts.join("  ");
        }).join("\n");
      },
    };
  }

  var diag = createDiagnostics({
    source: "figma",
    getBase: function () { try { return receiver.base || BRIDGE_URL; } catch (_e) { return ""; } },
    isActive: function () { return !!(receiver && receiver.running); },
  });

  // -------------------------------------------------------------------------
  // RECEIVER: HTTP long polling к локальному bridge
  // -------------------------------------------------------------------------
  var receiver = {
    running: false,
    hello: null,
    base: "",
    // Lease текущего запуска UI. Живёт только в runtime: ни clientStorage,
    // ни localStorage — перезапуск плагина обязан начинать Receiver заново.
    receiverId: null,
    pending: null,
    tasksDone: 0,
    abort: null,
    jobStartedAt: 0,
    layersDone: 0,
    statsTimer: null,
    // Итог job уже показан. Пустой long-poll не имеет права затереть его
    // словом «Ready»: пользователь должен увидеть, чем всё кончилось.
    finalNotice: false,
  };

  var startButton = id("receiver-start"), stopButton = id("receiver-stop");
  var logButton = id("receiver-log");
  var receiverStatus = id("receiver-status"), receiverStats = id("receiver-stats");
  var logoVideo = id("logo-video");

  id("bridge-label").textContent = BRIDGE_URL;

  function startLogoVideo() {
    if (!logoVideo || typeof logoVideo.play !== "function") return;
    try {
      var playback = logoVideo.play();
      // Запрет autoplay не должен влиять на саму миграцию.
      if (playback && typeof playback.catch === "function") playback.catch(function () {});
    } catch (_error) { /* видео — только индикатор, не часть pipeline */ }
  }

  function stopLogoVideo() {
    if (!logoVideo) return;
    try {
      if (typeof logoVideo.pause === "function") logoVideo.pause();
      logoVideo.currentTime = 0;
    } catch (_error) { /* некоторые runtime не дают seek до загрузки metadata */ }
  }

  function formatElapsed(ms) {
    ms = Math.max(0, Number(ms) || 0);
    if (ms < 1000) return Math.round(ms) + " мс";
    return (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + " с";
  }

  function updateReceiverStats(finalMs, finalLayers) {
    var elapsed = finalMs !== undefined && finalMs !== null
      ? Number(finalMs) || 0
      : (receiver.jobStartedAt ? Date.now() - receiver.jobStartedAt : 0);
    var layers = finalLayers !== undefined && finalLayers !== null
      ? Number(finalLayers) || 0
      : receiver.layersDone;
    // До первой задачи счётчик нечего показывать — строка просто скрыта.
    if (!receiver.jobStartedAt && finalMs === undefined && finalLayers === undefined) {
      receiverStats.classList.add("hidden");
      receiverStats.textContent = "";
      return;
    }
    receiverStats.classList.remove("hidden");
    receiverStats.textContent = "Время " + formatElapsed(elapsed) + " · Слои " + layers;
  }

  function startReceiverStats() {
    receiver.jobStartedAt = Date.now();
    receiver.layersDone = 0;
    receiver.finalNotice = false;
    startLogoVideo();
    if (receiver.statsTimer) clearInterval(receiver.statsTimer);
    receiver.statsTimer = setInterval(function () { updateReceiverStats(); }, 500);
    updateReceiverStats();
  }

  function stopReceiverStats(elapsedMs, layers) {
    stopLogoVideo();
    if (receiver.statsTimer) clearInterval(receiver.statsTimer);
    receiver.statsTimer = null;
    updateReceiverStats(elapsedMs, layers);
    receiver.jobStartedAt = 0;
    receiver.layersDone = Number(layers) || 0;
    receiver.finalNotice = true;
  }

  /**
   * Конец job, о котором не пришло задачи FINISH: job сняли, она упала или
   * продюсер оборвался. Раньше такой финал не замечался вовсе — интервал
   * статистики продолжал тикать, и «Время» росло под зелёным «Ready».
   */
  function finishReceiverStats(job) {
    var status = (job && job.status) || "unknown";
    var elapsed = receiver.jobStartedAt ? Date.now() - receiver.jobStartedAt : 0;
    var layers = receiver.layersDone;
    stopReceiverStats(elapsed, layers);
    if (status === "aborted") {
      setReceiverStatus("Migration прервана: перенесено слоёв " + layers +
        " за " + formatElapsed(elapsed), "err");
    } else if (status === "failed") {
      var reason = job && job.error && job.error.message ? ": " + job.error.message : "";
      setReceiverStatus("Migration не завершена" + reason +
        " — перенесено слоёв " + layers + " за " + formatElapsed(elapsed), "err");
    } else {
      setReceiverStatus("Migration завершена за " + formatElapsed(elapsed) +
        ": слоёв " + layers, "on");
    }
  }

  /**
   * Пустой long-poll — единственный момент, когда видно, что задач больше нет.
   * Он же единственное место, где заметен конец job, не пришедший задачей.
   * Авторитет здесь только у bridge: пауза внутри идущей job (продюсер долго
   * собирает большой корень) финалом не является и счётчик не замораживает.
   */
  async function reconcileIdle() {
    if (!receiver.jobStartedAt) {
      if (!receiver.finalNotice) setReceiverStatus("Ready", "on");
      return;
    }
    var snapshot;
    try {
      snapshot = await request("GET", receiverRoute("/receiver/status?role=receiver"));
    } catch (_error) {
      // Транспортный сбой концом job не является: решит следующий опрос.
      return;
    }
    if (!receiver.running) return;
    if (isSupersededResponse(snapshot)) return handleSuperseded(snapshot.body);
    var job = snapshot.body && snapshot.body.job;
    if (job && job.status === "running") return;
    finishReceiverStats(job);
  }

  function setReceiverStatus(text, kind) {
    receiverStatus.className = "status" + (kind === "err" ? " err" : "");
    receiverStatus.innerHTML = "";
    var dot = document.createElement("span");
    dot.className = "dot" + (kind ? " " + kind : "");
    var label = document.createElement("span");
    label.textContent = text;
    receiverStatus.appendChild(dot);
    receiverStatus.appendChild(label);
  }

  function request(method, route, body, signal) {
    return fetch(receiver.base + route, {
      method: method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      signal: signal,
    }).then(function (response) {
      if (response.status === 204) return { status: 204, body: null };
      return response.text().then(function (text) {
        return { status: response.status, body: text ? JSON.parse(text) : null };
      });
    });
  }

  /** Маршрут приёмника всегда несёт его lease. */
  function receiverRoute(route) {
    return route + (route.indexOf("?") >= 0 ? "&" : "?") +
      "receiverId=" + encodeURIComponent(receiver.receiverId || "");
  }

  /** Тело receiver-owned запроса всегда несёт его lease. */
  function receiverBody(body) {
    var payload = body || {};
    payload.receiverId = receiver.receiverId;
    return payload;
  }

  function isSupersededResponse(response) {
    var body = response && response.body;
    if (!body) return false;
    return body.code === "RECEIVER_SUPERSEDED" || body.code === "RECEIVER_ID_REQUIRED";
  }

  /**
   * Активирован другой документ. Это НЕ транспортный сбой: повторять poll или
   * молча перезапрашивать hello нельзя — иначе два окна отбирали бы цель друг
   * у друга по кругу. Пользователь включает Receiver явно.
   */
  function handleSuperseded(body) {
    var target = (body && body.documentName) || null;
    // `receiverActive: false` означает, что активного приёмника нет ВООБЩЕ:
    // никто ничего не включал, это наш собственный lease перестал быть
    // активным. Называть такое «активирован другой Receiver» — прямая ложь,
    // и именно она отправляла искать несуществующее второе окно Figma.
    var takenOver = !!(body && body.receiverActive);
    diag.info("receiver.superseded", { data: { documentName: target, receiverActive: takenOver } });
    diag.flush();
    receiver.running = false;
    receiver.receiverId = null;
    stopLogoVideo();
    if (receiver.statsTimer) clearInterval(receiver.statsTimer);
    receiver.statsTimer = null;
    if (receiver.abort) { try { receiver.abort.abort(); } catch (_e) {} }
    stopButton.classList.add("hidden");
    startButton.classList.remove("hidden");
    startButton.disabled = false;
    setReceiverStatus(
      takenOver
        ? (target
            ? "Отключён — активирован другой документ: " + target
            : "Отключён — активирован другой Receiver.")
        : "Отключён — bridge больше не считает этот Receiver активным. Нажмите Start receiver.",
      "err"
    );
  }

  function imageMime(extension) {
    var ext = String(extension || "png").toLowerCase();
    if (ext === "jpg" || ext === "jpeg") return "image/jpeg";
    if (ext === "webp") return "image/webp";
    if (ext === "gif") return "image/gif";
    return "image/png";
  }

  function base64Bytes(text) {
    var raw = atob(String(text || ""));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function bytesBase64(bytes) {
    var chunk = 0x8000;
    var out = "";
    for (var i = 0; i < bytes.length; i += chunk) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunk, bytes.length)));
    }
    return btoa(out);
  }

  function canvasBlob(canvas, type) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (blob) {
        if (blob) resolve(blob);
        else reject(new Error("Canvas не смог закодировать изображение"));
      }, type || "image/png", 0.96);
    });
  }

  async function downsampleImageForFigma(message) {
    var bytes = base64Bytes(message.bytesBase64);
    var blob = new Blob([bytes], { type: imageMime(message.extension) });
    var bitmap = await createImageBitmap(blob);
    try {
      var maxDimension = Math.max(256, Number(message.maxDimension) || 4096);
      var scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
      var width = Math.max(1, Math.round(bitmap.width * scale));
      var height = Math.max(1, Math.round(bitmap.height * scale));
      var canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      var ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("Canvas 2D недоступен");
      ctx.drawImage(bitmap, 0, 0, width, height);
      // PNG сохраняет alpha и не добавляет JPEG-артефакты в UI-графику.
      var outBlob = await canvasBlob(canvas, "image/png");
      var outBytes = new Uint8Array(await outBlob.arrayBuffer());
      return {
        bytesBase64: bytesBase64(outBytes),
        originalWidth: bitmap.width, originalHeight: bitmap.height,
        width: width, height: height,
      };
    } finally {
      if (bitmap && bitmap.close) bitmap.close();
    }
  }

  /** Отдаёт task в main thread и ждёт его ответа. */
  /** Как часто занятый приёмник напоминает bridge, что он ещё жив. */
  var TASK_HEARTBEAT_MS = 10000;

  /**
   * Пока плагин строит задачу, приёмник к bridge не обращается — ему нечего
   * сказать. Один тяжёлый корень строится минутами, и на всё это время lease
   * молча протухал: ACK прилетал в отказ `RECEIVER_SUPERSEDED`, а UI сообщал
   * про «другой Receiver», которого никто не включал.
   *
   * Heartbeat несёт taskId: bridge продлевает lease и ACK-таймаут ровно по той
   * задаче, которую этот приёмник действительно держит.
   */
  function runTaskInPlugin(task) {
    return new Promise(function (resolve) {
      var beat = setInterval(function () {
        if (!receiver.running || !receiver.receiverId) return;
        request("GET", receiverRoute("/receiver/status?role=receiver&taskId=" +
          encodeURIComponent(task.taskId))).catch(function () {
            // Пропущенный heartbeat не повод рушить импорт: следующий догонит.
          });
      }, TASK_HEARTBEAT_MS);

      receiver.pending = {
        taskId: task.taskId,
        resolve: function (outcome) {
          clearInterval(beat);
          resolve(outcome);
        },
      };
      send({ type: "receiver-task", task: task, options: IMPORT_OPTIONS });
    });
  }

  /** Экспериментальная ветка Direct PIX: `.pix` едет мимо плагина Pixso. */
  function isDirectTask(task) {
    return String((task && task.type) || "").indexOf("DIRECT_PIX_") === 0;
  }

  /** Режим job виден в каждой строке лога приёмника, а не только в START_JOB. */
  function taskMode(task) {
    // Direct PIX — не режим миграции Pixso, и подписывать его FAST или FULL
    // значит врать в логе.
    if (isDirectTask(task)) return "DIRECT_PIX";
    var mode = task && task.payload && task.payload.migrationMode;
    // Задача без поля mode — это старый продюсер: для него режим FULL.
    return String(mode || "FULL").toUpperCase() === "FAST" ? "FAST" : "FULL";
  }

  function describeDirect(task) {
    var p = task.payload || {};
    var kind = task.type.slice("DIRECT_PIX_".length);
    if (kind === "START") return "DIRECT PIX · старт · " + ((p.source && p.source.fileName) || "");
    if (kind === "ASSETS") return "DIRECT PIX · ассеты " + (p.index || 0) + "/" + (p.total || 0);
    if (kind === "DEFINITIONS") {
      return "DIRECT PIX · определения " + (p.index || 0) + "/" + (p.total || 0) +
        " (" + ((p.definitions && p.definitions.length) || 0) + ")";
    }
    if (kind === "ROOT") {
      return "DIRECT PIX · корень " + (p.index || 0) + "/" + (p.total || 0) + " · " + (p.rootName || "");
    }
    if (kind === "FINISH") return "DIRECT PIX · финал";
    return "DIRECT PIX · " + kind;
  }

  function describe(task) {
    var p = task.payload || {};
    if (isDirectTask(task)) return describeDirect(task);
    if (task.type === "START_JOB") {
      return "START_JOB · " + ((p.source && p.source.fileName) || "") + " · mode " + taskMode(task);
    }
    if (task.type === "PAGE_START") return "PAGE_START · " + (p.pageName || "");
    if (task.type === "ROOT_NODE") return "ROOT_NODE · " + (p.rootName || "") + " (" + (p.index || 0) + "/" + (p.total || 0) + ")";
    if (task.type === "PAGE_END") return "PAGE_END · " + (p.pageName || "");
    if (task.type === "COMPONENT_DEFS") return "COMPONENT_DEFS · " + (p.name || "") + " (" + (p.index || 0) + "/" + (p.total || 0) + ")";
    return task.type;
  }

  async function pollLoop() {
    while (receiver.running) {
      var next;
      try {
        next = await request("GET", receiverRoute("/receiver/task?wait=25"), null, receiver.abort.signal);
      } catch (error) {
        if (!receiver.running) return;
        // Сорванный запрос — это транспорт, а не потеря lease: продолжаем poll.
        diag.warn("poll.failed", { message: error && error.message });
        setReceiverStatus("Bridge недоступен — повтор через 3 с", "err");
        await new Promise(function (r) { setTimeout(r, 3000); });
        continue;
      }
      if (!receiver.running) return;
      if (next.status === 409 || next.status === 400) {
        if (isSupersededResponse(next)) return handleSuperseded(next.body);
      }
      if (next.status !== 200 || !next.body || !next.body.task) {
        await reconcileIdle();
        continue;
      }

      var task = next.body.task;
      if (task.type === "DIRECT_PIX_START" || task.type === "START_JOB") startReceiverStats();
      setReceiverStatus("Импорт: " + describe(task), "busy");
      diag.info("task.received", {
        jobId: task.jobId,
        taskId: task.taskId,
        data: { type: task.type, sequence: task.sequence, migrationMode: taskMode(task) },
      });
      var taskStartedAt = Date.now();
      var outcome = await runTaskInPlugin(task);

      try {
        if (outcome.ok) {
          receiver.tasksDone += 1;
          diag.info("task.imported", {
            jobId: task.jobId,
            taskId: task.taskId,
            data: {
              type: task.type,
              migrationMode: taskMode(task),
              elapsedMs: Date.now() - taskStartedAt,
              result: outcome.result,
            },
          });
          var acked = await request("POST", "/receiver/ack",
            receiverBody({ jobId: task.jobId, taskId: task.taskId, result: outcome.result }));
          if (isSupersededResponse(acked)) return handleSuperseded(acked.body);
          if (task.type === "DIRECT_PIX_ROOT") {
            receiver.layersDone += Number(outcome.result && outcome.result.ordinaryNodesCreated || 0) +
              Number(outcome.result && outcome.result.instancesCreated || 0);
            updateReceiverStats();
          } else if (task.type === "DIRECT_PIX_DEFINITIONS") {
            receiver.layersDone += Number(outcome.result && outcome.result.definitionNodes || 0);
            updateReceiverStats();
          }
          if (task.type === "DIRECT_PIX_FINISH") {
            // Минимальная индикация экспериментальной ветки: подробный отчёт
            // печатает CLI, здесь достаточно итога и числа непокрытых случаев.
            var directTotals = (outcome.result && outcome.result.totals) || {};
            var directElapsed = Number(outcome.result && (outcome.result.totalImportMs || (outcome.result.timings && outcome.result.timings.totalImportMs))) ||
              (receiver.jobStartedAt ? Date.now() - receiver.jobStartedAt : 0);
            var directLayers = Number(directTotals.ordinaryNodesCreated || 0) +
              Number(directTotals.instancesCreated || 0) + Number(directTotals.definitionNodes || 0);
            stopReceiverStats(directElapsed, directLayers);
            setReceiverStatus(
              "Direct PIX завершён за " + formatElapsed(directElapsed) +
              ": слоёв " + directLayers +
              ", определений " + (directTotals.definitionsCreated || 0) +
              ", инстансов " + (directTotals.instancesCreated || 0) +
              ", изображений уменьшено " + (directTotals.assetsDownsampled || 0) +
              ", не поддержано " + (directTotals.unsupported || 0),
              "on"
            );
          } else if (task.type === "FINISH_JOB") {
            var totals = (outcome.result && outcome.result.totals) || {};
            var finishTiming = (outcome.result && outcome.result.timing) || {};
            diag.info("job.finished", {
              jobId: task.jobId,
              taskId: task.taskId,
              data: {
                migrationMode: taskMode(task),
                buildMs: finishTiming.buildMs || 0,
                promoteMs: finishTiming.promoteMs || 0,
                totals: totals,
              },
            });
            var normalElapsed = Number(finishTiming.totalMs || finishTiming.buildMs || 0) ||
              (receiver.jobStartedAt ? Date.now() - receiver.jobStartedAt : 0);
            stopReceiverStats(normalElapsed, Number(totals.nodes || 0));
            setReceiverStatus(
              "Миграция завершена (" + taskMode(task) + ") за " + formatElapsed(normalElapsed) +
              ": экранов " + (totals.roots || 0) + ", слоёв " + (totals.nodes || 0),
              "on"
            );
          }
        } else {
          // Отказ без фазы и стека не диагностируется: «лог обрывается» — это
          // именно тот случай, ради которого контекст сюда и попадает.
          diag.error("task.importFailed", {
            jobId: task.jobId,
            taskId: task.taskId,
            message: outcome.message,
            data: {
              type: task.type,
              migrationMode: taskMode(task),
              elapsedMs: Date.now() - taskStartedAt,
              code: outcome.code,
              errorName: outcome.errorName || null,
              phase: outcome.phase || null,
              stack: outcome.stack || null,
            },
          });
          setReceiverStatus("Ошибка импорта: " + outcome.message, "err");
          // Определение компонента — оптимизация поверх snapshot-миграции.
          // Его отказ помечается нефатальным: продюсер просто не получит
          // подтверждения и отправит инстансы прежним snapshot-ом.
          var fatal = task.type !== "COMPONENT_DEFS";
          // Фатальный отказ закрывает job: счётчик обязан замереть здесь же,
          // иначе он тикал бы дальше, а сообщение об ошибке затёрло бы
          // «Ready» на следующем пустом опросе. Отказ COMPONENT_DEFS
          // нефатален — там job продолжается, и счётчик тоже.
          if (fatal && receiver.jobStartedAt) {
            stopReceiverStats(Date.now() - receiver.jobStartedAt, receiver.layersDone);
          }
          var reported = await request("POST", "/receiver/error", receiverBody({
            jobId: task.jobId, taskId: task.taskId,
            code: outcome.code || "IMPORT_FAILED", message: outcome.message, fatal: fatal,
          }));
          if (isSupersededResponse(reported)) return handleSuperseded(reported.body);
        }
      } catch (transportError) {
        // ACK не доставлен: bridge сам отвалится по таймауту, продолжаем цикл.
        diag.error("ack.failed", {
          jobId: task.jobId,
          taskId: task.taskId,
          message: transportError && transportError.message,
        });
        setReceiverStatus("Не удалось отправить ACK — bridge недоступен", "err");
      }
    }
  }

  function saveDiagnostics(prefix) {
    var text = diag.text();
    if (!text) return null;
    try {
      var blob = new Blob([text], { type: "text/plain" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = prefix + "-" + new Date().toISOString().replace(/[:.]/g, "-") + ".log";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return text;
    } catch (_e) {
      return text;
    }
  }

  logButton.onclick = function () {
    diag.flush();
    // Единственная строка статуса на окно: результат сохранения показывается
    // там же, поэтому не перетираем её во время активного импорта.
    var text = saveDiagnostics("pixso2figma-figma");
    if (!receiver.running) setReceiverStatus(text ? "Лог сохранён" : "Лог пуст", text ? "on" : "err");
  };

  startButton.onclick = async function () {
    receiver.base = BRIDGE_URL;
    startButton.disabled = true;
    setReceiverStatus("Подключение к bridge…", "busy");
    var hello;
    try {
      hello = await request("POST", "/receiver/hello", {
        receiverVersion: (receiver.hello && receiver.hello.receiverVersion) || "0.1.0",
        protocolVersion: PROTOCOL_VERSION,
        documentName: (receiver.hello && receiver.hello.documentName) || "Figma",
        // Собственный id намеренно не отправляется: нажатие Start — это заявка
        // на новый lease, «последний включённый Receiver» становится целью.
      });
    } catch (error) {
      startButton.disabled = false;
      setReceiverStatus("Bridge не запущен — откройте Pixso2Figma.command", "err");
      return;
    }
    var helloBody = hello.body || {};
    if (helloBody.code === "RECEIVER_SWITCH_BLOCKED") {
      // Цель активной migration неизменяема: в running-состояние не входим.
      startButton.disabled = false;
      setReceiverStatus(
        "Идёт migration в «" + (helloBody.documentName || "другой документ") +
        "». Дождитесь её завершения и включите Receiver снова.",
        "err"
      );
      diag.warn("receiver.switchBlocked", { data: { documentName: helloBody.documentName || null } });
      return;
    }
    if (helloBody.code === "PROTOCOL_MISMATCH") {
      startButton.disabled = false;
      setReceiverStatus(
        "Bridge использует протокол " + helloBody.protocolVersion + ", плагин — " + PROTOCOL_VERSION +
        ". Обновите Bridge и плагин.",
        "err"
      );
      return;
    }
    if (hello.status !== 200 || !helloBody.receiverId) {
      startButton.disabled = false;
      setReceiverStatus("Bridge ответил " + hello.status, "err");
      return;
    }
    receiver.receiverId = helloBody.receiverId;
    receiver.running = true;
    receiver.abort = new AbortController();
    diag.info("receiver.started", {
      data: {
        documentName: helloBody.documentName || (receiver.hello && receiver.hello.documentName),
        promoteComponents: IMPORT_OPTIONS.promoteComponents,
        createPages: IMPORT_OPTIONS.createPages,
      },
    });
    send({ type: "receiver-reset" });
    startButton.classList.add("hidden");
    stopButton.classList.remove("hidden");
    startButton.disabled = false;
    receiver.finalNotice = false;
    setReceiverStatus("Ready", "on");
    pollLoop();
  };

  stopButton.onclick = function () {
    diag.info("receiver.stopped", { data: { tasksDone: receiver.tasksDone } });
    diag.flush();
    receiver.running = false;
    stopLogoVideo();
    if (receiver.statsTimer) clearInterval(receiver.statsTimer);
    receiver.statsTimer = null;
    if (receiver.abort) { try { receiver.abort.abort(); } catch (_e) {} }
    // Без собственного lease /bye не отправляется вовсе: отключить чужой,
    // уже активированный Receiver эта сессия права не имеет.
    if (receiver.receiverId) {
      request("POST", "/receiver/bye", { receiverId: receiver.receiverId }).catch(function () {});
      receiver.receiverId = null;
    }
    stopButton.classList.add("hidden");
    startButton.classList.remove("hidden");
    setReceiverStatus("Остановлен");
  };

  // -------------------------------------------------------------------------
  // Сообщения из main thread
  // -------------------------------------------------------------------------
  window.onmessage = function (e) {
    var m = e.data && e.data.pluginMessage;
    if (!m) return;

    if (m.type === "receiver-hello") { receiver.hello = m; return; }

    if (m.type === "image-downsample-request") {
      downsampleImageForFigma(m).then(function (result) {
        send({
          type: "image-downsample-result", requestId: m.requestId, assetId: m.assetId,
          bytesBase64: result.bytesBase64, originalWidth: result.originalWidth,
          originalHeight: result.originalHeight, width: result.width, height: result.height,
        });
      }).catch(function (error) {
        send({ type: "image-downsample-failed", requestId: m.requestId, assetId: m.assetId, message: error && error.message || String(error) });
      });
      return;
    }

    if (m.type === "receiver-task-done") {
      if (receiver.pending && receiver.pending.taskId === m.taskId) {
        var resolve = receiver.pending.resolve;
        receiver.pending = null;
        resolve({ ok: true, result: m.result });
      }
      return;
    }
    if (m.type === "receiver-task-failed") {
      if (receiver.pending && receiver.pending.taskId === m.taskId) {
        // Промис всегда resolve: неудача — это исход задачи, а не сбой моста.
        var settle = receiver.pending.resolve;
        receiver.pending = null;
        settle({ ok: false, code: m.code, message: m.message, errorName: m.errorName, stack: m.stack, phase: m.phase });
      }
      return;
    }
  };
